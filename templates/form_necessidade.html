{% extends 'base.html' %}
{% load static %}
{% block title %}Campanha - EducaDoa{% endblock %}
{% block content %}
<main class="escola-login-container">
  <div class="escola-login-card">
    <div class="escola-card-header">
      <div class="escola-icon-wrap">
        <i class="fas fa-bullhorn"></i>
      </div>
      <h2>Campanha de Necessidade</h2>
      <p>Publique o que sua escola precisa e sua meta de arrecadação.</p>
    </div>
    <form class="escola-form" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div style="text-align: left; margin-bottom: 20px;">
        {{ form.as_p }}
      </div>
      <button type="submit" class="btn-escola-submit">
        <i class="fas fa-save"></i> Salvar
      </button>
    </form>
  </div>
</main>
{% endblock %}
